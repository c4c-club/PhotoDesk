# .github/workflows/ios.yml —— CI 编译/测试/出包通道（docs/06 §5 + §7.4）
# 职责说明：
#   core-linux：无 Mac 验证 PhotoDeskCore 纯逻辑（与本地 scripts/test-core.ps1 同一条命令）
#   build     ：macos-14 上 xcodegen → 模拟器 build/test（iOS 15.5）→ 产物两件：模拟器 .app.zip + 未签名 ipa（AltServer 签名装真机用）
name: Build & Test

# docs-only 变更不触发（省 macOS 时长）
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

# 私有仓库 macOS 按 10× 计费，快速连续 push 时取消过期 run 省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test PhotoDeskCore
        run: swift test --package-path PhotoDeskCore

  build:
    runs-on: macos-14
    needs: core-linux
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          # 新版 xcodegen 按 Xcode 16 格式（objectVersion 77）写出，锁定的 Xcode 15.4 无法读取（docs/06 §1）；
          # 归一到 Xcode 15 格式（63）。升级到 Xcode 16 时可删除此步。
          sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 63/' PhotoDesk.xcodeproj/project.pbxproj
          grep -m1 objectVersion PhotoDesk.xcodeproj/project.pbxproj

      # macos-14 镜像可能未预装 iOS 15.5 运行时；没有则现场下载（一次约 7GB，之后走 runner 缓存无此步）
      - name: Ensure iOS 15.5 simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q "iOS 15.5"; then
            echo "iOS 15.5 runtime 已就绪"
          else
            echo "iOS 15.5 runtime 未预装，开始下载安装（需数分钟）..."
            command -v xcodes >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodes
            # 安装 runtime 需要 root；sudo 会重置 PATH，用绝对路径调用
            sudo "$(command -v xcodes)" runtimes install "iOS 15.5"
          fi

      - name: Create simulator
        run: xcrun simctl create CI-iPhone13 "iPhone 13" "com.apple.CoreSimulator.SimRuntime.iOS-15-5" || true

      - name: Build (simulator)
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=CI-iPhone13,OS=15.5' \
            -derivedDataPath build/DerivedData build

      - name: Test (simulator)
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk \
            -destination 'platform=iOS Simulator,name=CI-iPhone13,OS=15.5' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -skip-testing:PhotoDeskUITests/PerformanceUITests test

      - name: Extract UI test attachments
        if: always()
        run: |
          mkdir -p build/attachments
          # Xcode 16+ 用 export attachments；15.x 退回 export diagnostics（含失败自动截图）
          xcrun xcresulttool export attachments --path build/TestResults.xcresult \
            --output-path build/attachments \
          || xcrun xcresulttool export diagnostics --path build/TestResults.xcresult \
            --output-path build/attachments \
          || echo "附件提取失败（非致命，见上方报错）"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-attachments
          path: build/attachments
          if-no-files-found: ignore

      - name: Package simulator app
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          cd "$(dirname "$APP")"
          zip -qry "$GITHUB_WORKSPACE/build/PhotoDesk-Simulator.app.zip" "$(basename "$APP")"

      # 部署目标红线校验（AGENTS.md 常见陷阱 #1：Deployment Target 被依赖抬高 → 老设备 dyld 崩溃）
      - name: Verify deployment target (minos must be 15.0)
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          otool -l "$APP/PhotoDesk" | grep -A3 LC_BUILD_VERSION
          otool -l "$APP/PhotoDesk" | grep -A3 LC_BUILD_VERSION | grep -q "minos 15.0" || {
            echo "::error::LC_BUILD_VERSION minos != 15.0"; exit 1; }

      # 未签名 ipa（手机验证用，docs/06 §7.4）：CODE_SIGNING_ALLOWED=NO 产出未签名 .app，Payload 打包成 ipa；
      # Windows 上由 AltServer 用免费 Apple ID 现场签名安装
      - name: Build unsigned ipa
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk -sdk iphoneos -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -archivePath build/PhotoDesk.xcarchive archive
          mkdir -p build/Payload
          cp -R build/PhotoDesk.xcarchive/Products/Applications/PhotoDesk.app build/Payload/
          cd build && zip -qry PhotoDesk-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDesk-Simulator-app-zip
          path: build/PhotoDesk-Simulator.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDesk-unsigned-ipa
          path: build/PhotoDesk-unsigned.ipa

      # M0 冒烟（docs/05 M0 验收）：装包 → 启动 → 导入 300 张测试图 → 截图存档
      - name: Simulator smoke (install / launch / photos / screenshot)
        run: |
          xcrun simctl boot CI-iPhone13 2>/dev/null || true
          xcrun simctl bootstatus CI-iPhone13 -b
          # Pillow 由脚本自管（venv 优先，PEP 668 兼容）
          bash scripts/sim-photos.sh
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install CI-iPhone13 "$APP"
          # 注：iOS 17.5 上 Photos 授权不走 TCC（simctl privacy 无效），
          # 授权由性能测试的中断监视器自动点系统弹窗完成（docs/06 §6.2 模式）
          xcrun simctl launch CI-iPhone13 com.example.PhotoDesk
          sleep 5
          mkdir -p build/screenshots
          # 授权前截图 = 授权引导页（M1 验收项：授权引导文案）
          xcrun simctl io CI-iPhone13 screenshot build/screenshots/m1-intro.png

      - uses: actions/upload-artifact@v4
        with:
          name: m1-screenshots
          path: build/screenshots

      # M1 性能验收（docs/05 §3）：5,000+ 张库 冷启动 / 滚动内存（docs/06 §6.3，Instruments 不可用时的 CI 替代）
      - name: Performance tests (5,000+ photos)
        run: |
          rm -rf /tmp/simphotos
          bash scripts/sim-photos.sh 5000
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk \
            -destination 'platform=iOS Simulator,name=CI-iPhone13,OS=15.5' \
            -derivedDataPath build/DerivedData \
            -only-testing:PhotoDeskUITests/PerformanceUITests test
          # 授权已在 UI 测试中完成（弹窗自动点允许）且持久化：此时启动直达网格
          # CI 虚拟机冷启动 5,300 张库较慢（首帧前要建 PHFetchResult），给足 25s
          xcrun simctl launch CI-iPhone13 com.example.PhotoDesk
          sleep 25
          xcrun simctl io CI-iPhone13 screenshot build/screenshots/m1-grid.png

      - uses: actions/upload-artifact@v4
        with:
          name: m1-grid-screenshot
          path: build/screenshots/m1-grid.png

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/Logs
