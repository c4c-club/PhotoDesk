# .github/workflows/ios.yml —— CI 编译/测试/出包通道（docs/06 §5 + §7.4）
# 职责说明：
#   core-linux：无 Mac 验证 PhotoDeskCore 纯逻辑（与本地 scripts/test-core.ps1 同一条命令）
#   build     ：macos-15 + Xcode 16.4 上 xcodegen → 模拟器 build/test（iOS 16.4 运行时）→ 模拟器 .app.zip + 未签名 ipa
#   M13：iOS 16 基线；runtime / destination / minos 由顶部 env 单一真值控制，禁止散落版本号。
name: Build & Test

# docs-only 变更不触发（省 macOS 时长）
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

# 私有仓库 macOS 按 10× 计费，快速连续 push 时取消过期 run 省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_RUNTIME: '16.4'
  IOS_DESTINATION_OS: '16.4'
  MINOS_VERSION: '16.0'

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test PhotoDeskCore (with coverage)
        run: |
          swift test --enable-code-coverage --package-path PhotoDeskCore
      - name: Coverage report
        run: |
          cd PhotoDeskCore
          PROFDATA=$(find .build -name '*.profdata' | head -1)
          BINARY=$(find .build -type f -name 'PhotoDeskCorePackageTests.xctest' | head -1)
          if [ -n "$PROFDATA" ] && [ -n "$BINARY" ]; then
            llvm-cov report --instr-profile="$PROFDATA" "$BINARY" | tail -8
          else
            echo "coverage artifacts not found (non-fatal)"
          fi

  build:
    runs-on: macos-15
    needs: core-linux
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          # 统一到构建链锁定的 objectVersion 63；新版 XcodeGen 默认更高版本，CI 产物以本设置为准。
          sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 63/' PhotoDesk.xcodeproj/project.pbxproj
          grep -m1 objectVersion PhotoDesk.xcodeproj/project.pbxproj

      # 若 macos-15 + Xcode 16.4 镜像没有 iOS 16.4 runtime，只需改顶部 env 到该 image 可用的最低 iOS 16.x，并在 docs/21 记录原因。
      - name: Ensure iOS simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q "iOS $IOS_RUNTIME"; then
            echo "iOS $IOS_RUNTIME runtime 已就绪"
          else
            echo "iOS $IOS_RUNTIME runtime 未预装，开始下载安装（需数分钟）..."
            command -v xcodes >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodes
            sudo "$(command -v xcodes)" runtimes install "iOS $IOS_RUNTIME"
          fi

      - name: Create simulator
        run: |
          RUNTIME_SUFFIX="${IOS_RUNTIME//./-}"
          xcrun simctl create CI-iPhone13 "iPhone 13" "com.apple.CoreSimulator.SimRuntime.iOS-$RUNTIME_SUFFIX" || true

      - name: Verify generated build settings
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=CI-iPhone13,OS=$IOS_DESTINATION_OS" \
            -showBuildSettings | grep "IPHONEOS_DEPLOYMENT_TARGET = $MINOS_VERSION"

      - name: Build (simulator)
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=CI-iPhone13,OS=$IOS_DESTINATION_OS" \
            -derivedDataPath build/DerivedData build

      # UI 测试播种（docs/09 Phase 8）：系统默认照片 <8 张，查看器定位/多选滚动/会话用例需要足够样本；
      # 带 EXIF 日期（2020–2026 每月 2 张，≈166 张）供筛选/位置记忆测试
      - name: Seed photos for UI tests
        run: |
          xcrun simctl boot CI-iPhone13 2>/dev/null || true
          xcrun simctl bootstatus CI-iPhone13 -b
          bash scripts/sim-photos-dated.sh 2

      - name: Test (simulator)
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk \
            -destination "platform=iOS Simulator,name=CI-iPhone13,OS=$IOS_DESTINATION_OS" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -skip-testing:PhotoDeskUITests/PerformanceUITests test

      # M12/M13 取证：UI 测试失败时 App 视觉现场 + App 自写崩溃/缩放日志
      - name: Capture simulator state on failure
        if: failure()
        run: |
          mkdir -p build/screenshots
          xcrun simctl io CI-iPhone13 screenshot build/screenshots/failure-sim-state.png || true
          APP_DATA=$(xcrun simctl get_app_container CI-iPhone13 com.example.PhotoDesk data 2>/dev/null || true)
          if [ -n "$APP_DATA" ]; then
            cp "$APP_DATA/Library/Application Support/Logs/last-exception.log" build/screenshots/last-exception.log 2>/dev/null || true
            cp "$APP_DATA/Library/Application Support/Logs/signal-crash.log" build/screenshots/signal-crash.log 2>/dev/null || true
            cp "$APP_DATA/Library/Application Support/Logs/viewer-trace.log" build/screenshots/viewer-trace.log 2>/dev/null || true
            tail -40 "$APP_DATA/Library/Application Support/Logs/viewer-trace.log" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshot
          path: build/screenshots
          if-no-files-found: ignore

      - name: Extract UI test attachments
        if: always()
        run: |
          mkdir -p build/attachments
          # Xcode 16+ 用 export attachments；旧工具链退回 export diagnostics（含失败自动截图）
          xcrun xcresulttool export attachments --path build/TestResults.xcresult \
            --output-path build/attachments \
          || xcrun xcresulttool export diagnostics --path build/TestResults.xcresult \
            --output-path build/attachments \
          || echo "附件提取失败（非致命，见上方报错）"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-attachments
          path: build/attachments
          if-no-files-found: ignore

      - name: Package simulator app
        if: always()
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          cd "$(dirname "$APP")"
          zip -qry "$GITHUB_WORKSPACE/build/PhotoDesk-Simulator.app.zip" "$(basename "$APP")"

      # 部署目标红线校验：Deployment Target 被依赖抬高会导致老设备 dyld 崩溃
      - name: Verify deployment target
        if: always()
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          otool -l "$APP/PhotoDesk" | grep -A3 LC_BUILD_VERSION
          otool -l "$APP/PhotoDesk" | grep -A3 LC_BUILD_VERSION | grep -q "minos $MINOS_VERSION" || {
            echo "::error::LC_BUILD_VERSION minos != $MINOS_VERSION"; exit 1; }

      # 未签名 ipa（手机验证用，docs/06 §7.4）：CODE_SIGNING_ALLOWED=NO 产出未签名 .app，Payload 打包成 ipa；
      # Windows 上由 AltServer 用免费 Apple ID 现场签名安装（docs/09 D17：附 SHA256 + 自签说明 docs/12）
      - name: Build unsigned ipa
        if: always()
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk -sdk iphoneos -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -archivePath build/PhotoDesk.xcarchive archive
          mkdir -p build/Payload
          cp -R build/PhotoDesk.xcarchive/Products/Applications/PhotoDesk.app build/Payload/
          cd build && zip -qry PhotoDesk-unsigned.ipa Payload
          shasum -a 256 PhotoDesk-unsigned.ipa > PhotoDesk-unsigned.ipa.sha256
          cat PhotoDesk-unsigned.ipa.sha256

      # IPA 产物校验（Payload 结构 / MinimumOSVersion / minos / 确认未签名）
      - name: Verify unsigned ipa
        if: always()
        run: |
          cd build
          unzip -l PhotoDesk-unsigned.ipa | grep -q "Payload/PhotoDesk.app/PhotoDesk" || {
            echo "::error::IPA 缺 Payload/PhotoDesk.app/PhotoDesk"; exit 1; }
          unzip -qo PhotoDesk-unsigned.ipa -d ipa-check Payload/PhotoDesk.app/Info.plist
          PLIST_MINOS=$(plutil -extract MinimumOSVersion raw -o - ipa-check/Payload/PhotoDesk.app/Info.plist)
          echo "MinimumOSVersion=$PLIST_MINOS"
          test "$PLIST_MINOS" = "$MINOS_VERSION" || {
            echo "::error::MinimumOSVersion != $MINOS_VERSION"; exit 1; }
          unzip -qo PhotoDesk-unsigned.ipa -d ipa-check Payload/PhotoDesk.app/PhotoDesk
          otool -l ipa-check/Payload/PhotoDesk.app/PhotoDesk | grep -A3 LC_BUILD_VERSION
          otool -l ipa-check/Payload/PhotoDesk.app/PhotoDesk | grep -A3 LC_BUILD_VERSION | grep -q "minos $MINOS_VERSION" || {
            echo "::error::ipa minos != $MINOS_VERSION"; exit 1; }
          if codesign -dv ipa-check/Payload/PhotoDesk.app 2>&1 | grep -qi "Signature"; then
            echo "::error::IPA 不应是已签名包"; exit 1
          fi
          echo "[OK] 未签名 IPA 校验通过（Payload / MinimumOSVersion=$MINOS_VERSION / minos=$MINOS_VERSION / 未签名）"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhotoDesk-Simulator-app-zip
          path: build/PhotoDesk-Simulator.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhotoDesk-unsigned-ipa
          path: |
            build/PhotoDesk-unsigned.ipa
            build/PhotoDesk-unsigned.ipa.sha256

      - name: Simulator smoke (install / launch / photos / screenshot)
        run: |
          xcrun simctl boot CI-iPhone13 2>/dev/null || true
          xcrun simctl bootstatus CI-iPhone13 -b
          bash scripts/sim-photos.sh
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install CI-iPhone13 "$APP"
          # 授权由性能测试的中断监视器自动点系统弹窗完成（docs/06 §6.2 模式）
          xcrun simctl launch CI-iPhone13 com.example.PhotoDesk
          sleep 5
          mkdir -p build/screenshots
          xcrun simctl io CI-iPhone13 screenshot build/screenshots/m1-intro.png

      - uses: actions/upload-artifact@v4
        with:
          name: m1-screenshots
          path: build/screenshots

      - name: Performance tests (5,000+ photos)
        run: |
          rm -rf /tmp/simphotos
          bash scripts/sim-photos.sh 5000
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk \
            -destination "platform=iOS Simulator,name=CI-iPhone13,OS=$IOS_DESTINATION_OS" \
            -derivedDataPath build/DerivedData \
            -only-testing:PhotoDeskUITests/PerformanceUITests test
          xcrun simctl launch CI-iPhone13 com.example.PhotoDesk
          sleep 25
          xcrun simctl io CI-iPhone13 screenshot build/screenshots/m1-grid.png

      - uses: actions/upload-artifact@v4
        with:
          name: m1-grid-screenshot
          path: build/screenshots/m1-grid.png

      - name: Collect crash reports on failure
        if: failure()
        run: |
          mkdir -p build/crashes
          cp -R ~/Library/Logs/DiagnosticReports build/crashes/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-reports
          path: build/crashes
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/Logs
          if-no-files-found: ignore
