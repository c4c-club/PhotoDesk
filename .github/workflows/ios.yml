# .github/workflows/ios.yml —— CI 编译/测试/出包通道（docs/06 §5 + §7.4）
# 职责说明：
#   core-linux：无 Mac 验证 PhotoDeskCore 纯逻辑（与本地 scripts/test-core.ps1 同一条命令）
#   build     ：macos-15 + Xcode 16.4 上 xcodegen → 模拟器 build/test（iOS 16.4 运行时）→ 模拟器 .app.zip + 未签名 ipa
#   M13：iOS 16 基线；runtime / destination / minos 由顶部 env 单一真值控制，禁止散落版本号。
name: Build & Test

# docs-only 变更不触发（省 macOS 时长）
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      test_filter:
        description: '可选：xcodebuild -only-testing 参数（留空跑全量）'
        required: false
        type: string

# 私有仓库 macOS 按 10× 计费，快速连续 push 时取消过期 run 省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_RUNTIME: '18.6'
  IOS_DESTINATION_OS: '18.6'
  MINOS_VERSION: '16.0'

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test PhotoDeskCore (with coverage)
        run: |
          swift test --enable-code-coverage --package-path PhotoDeskCore
      - name: Coverage report
        run: |
          cd PhotoDeskCore
          PROFDATA=$(find .build -name '*.profdata' | head -1)
          BINARY=$(find .build -type f -name 'PhotoDeskCorePackageTests.xctest' | head -1)
          if [ -n "$PROFDATA" ] && [ -n "$BINARY" ]; then
            llvm-cov report --instr-profile="$PROFDATA" "$BINARY" | tail -8
          else
            echo "coverage artifacts not found (non-fatal)"
          fi

  build:
    runs-on: macos-15
    needs: core-linux
    # M15：全量 UI 套件（缩放 500 轮压力 + 10 次冷启动位置验证）在模拟器上超出 90min，
    # 上调到 240min；仅为基础设施上限，不改变任何测试语义。
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          # 统一到构建链锁定的 objectVersion 63；新版 XcodeGen 默认更高版本，CI 产物以本设置为准。
          sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 63/' PhotoDesk.xcodeproj/project.pbxproj
          grep -m1 objectVersion PhotoDesk.xcodeproj/project.pbxproj

      # 若 macos-15 + Xcode 16.4 镜像没有 iOS 16.4 runtime，只需改顶部 env 到该 image 可用的最低 iOS 16.x，并在 docs/21 记录原因。
      - name: Ensure iOS simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q "iOS $IOS_RUNTIME"; then
            echo "iOS $IOS_RUNTIME runtime 已就绪"
          else
            echo "iOS $IOS_RUNTIME runtime 未预装，开始下载安装（需数分钟）..."
            command -v xcodes >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodes
            sudo "$(command -v xcodes)" runtimes install "iOS $IOS_RUNTIME"
          fi

      # 实验分支（tmp/m18-t08-runtime18）：新镜像上 simctl create/erase 的设备每次 boot
      # 都跑 LaunchServicesMigrator 数据迁移且以 0xFFFFFFFF 终止（44127767064 取证实锤），
      # 半启动设备上 runner 永远装不上 → 改用镜像预创建设备（无首次迁移）
      - name: Select precreated simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -40
          # 按名字精确锁 iPhone 16 Pro：镜像含多台预创建 iPhone，取「第一台」会随镜像
          # 设备清单漂移到被多轮安装搞挂 TCC/photolived 的设备（run 44212270710 实锤：
          # C67F9F5E 上 requestAuthorization 既无弹窗也无回调，App 永卡 intro；
          # 已验证设备为 iPhone 16 Pro），必须可复现地选中同一台
          UDID=$(xcrun simctl list devices available | awk '/-- iOS 18.6 --/{f=1;next} /^-- iOS/{f=0} f && /iPhone 16 Pro \(/ {match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit}')
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | awk '/-- iOS 18.6 --/{f=1;next} /^-- iOS/{f=0} f && /iPhone/ {match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit}'); fi
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | awk '/-- iOS 18.5 --/{f=1;next} /^-- iOS/{f=0} f && /iPhone 16 Pro \(/ {match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit}'); fi
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | awk '/-- iOS 18.5 --/{f=1;next} /^-- iOS/{f=0} f && /iPhone/ {match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit}'); fi
          echo "PICKED_UDID=$UDID"
          if [ -z "$UDID" ]; then echo '::error::无预创建 iPhone 设备'; exit 1; fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          # 测试用镜像最新 Xcode：预创建 18.6 runtime 与锁定 Xcode 16.4 的 SDK 不配对
          # （destination 匹配失败实锤 run 44131426317）；构建仍走 16.4 锁定链，minos 门禁不变
          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "NEWEST_XCODE=$NEWEST_XCODE"
          echo "TEST_DEVELOPER_DIR=$NEWEST_XCODE/Contents/Developer" >> $GITHUB_ENV

      - name: Create simulator
        if: env.SIM_UDID == ''
        run: |
          RUNTIME_SUFFIX="${IOS_RUNTIME//./-}"
          xcrun simctl create CI-iPhone13 "iPhone 13" "com.apple.CoreSimulator.SimRuntime.iOS-$RUNTIME_SUFFIX" || true

      - name: Verify generated build settings
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -showBuildSettings | grep "IPHONEOS_DEPLOYMENT_TARGET = $MINOS_VERSION"

      - name: Build (simulator)
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData build

      # UI 测试播种（docs/09 Phase 8）：系统默认照片 <8 张，查看器定位/多选滚动/会话用例需要足够样本；
      # 带 EXIF 日期（2020–2026 每月 2 张，≈166 张）供筛选/位置记忆测试
      - name: Seed photos for UI tests
        run: |
          xcrun simctl boot $SIM_UDID 2>/dev/null || true
          xcrun simctl bootstatus $SIM_UDID -b
          # 预授权照片权限（run 44195619201 实锤：照片授权弹窗为 App 内 alert，
          # 中断监视器派发时机不稳导致首套件 30s 网格判定失败）
          xcrun simctl privacy $SIM_UDID grant photos com.example.PhotoDesk || true
          bash scripts/sim-photos-dated.sh 2

      - name: Test (simulator)
        env:
          TEST_FILTER: ${{ github.event.inputs.test_filter }}
          DEVELOPER_DIR: ${{ env.TEST_DEVELOPER_DIR }}
        run: |
          set -o pipefail
          # 每次尝试前彻底重置模拟器态（2026-11-16 挂死窗口实锤：boot 正常但 runner
          # 进程拉起后零输出 9 分钟判死；fresh springboard + 清缓存可显著降低复发）
          reset_sim() {
            xcrun simctl shutdown all 2>/dev/null || true
            # 重装 App 会清 TCC 授权（新装设备上弹窗派发时机不稳），启动后补授权一次
            xcrun simctl privacy $SIM_UDID grant photos com.example.PhotoDesk 2>/dev/null || true
            sleep 3
            xcrun simctl boot $SIM_UDID 2>/dev/null || true
            xcrun simctl bootstatus $SIM_UDID -b
          }
          DEST="id=$SIM_UDID"
          echo "SIM_UDID=$SIM_UDID"
          run_tests() {
            if [ -n "$TEST_FILTER" ]; then
              echo "targeted test filter: $TEST_FILTER"
              xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk \
                -destination "$DEST" \
                -derivedDataPath build/DerivedData \
                -resultBundlePath build/TestResults.xcresult \
                $TEST_FILTER test 2>&1 | tee build/test-output.log
            else
              xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk \
                -destination "$DEST" \
                -derivedDataPath build/DerivedData \
                -resultBundlePath build/TestResults.xcresult \
                -skip-testing:PhotoDeskUITests/PerformanceUITests test 2>&1 | tee build/test-output.log
            fi
          }
          # runner 启动挂死（macos-15 舰队间歇故障：进程拉起后 9 分钟零输出判死）只重置重试，
          # 不吞真实断言失败：仅当日志命中挂死特征才重试，最多 2 次
          reset_sim
          if run_tests; then
            echo "TEST_OK"
          else
            if grep -q "never began executing tests" build/test-output.log; then
              echo "=== 挂死现场取证（重置前）==="
              echo "--- 磁盘 ---"; df -h / | tail -2
              echo "--- runner 安装态 ---"
              xcrun simctl listapps $SIM_UDID 2>/dev/null | grep -B2 -A6 "PhotoDeskUITests" | head -30 || echo "runner 未安装"
              echo "--- sim 侧 installd/SpringBoard ---"
              xcrun simctl spawn $SIM_UDID log show --last 10m \
                --predicate 'eventMessage CONTAINS "PhotoDeskUITests" OR process == "installd"' \
                --style compact 2>/dev/null | tail -c 8000 || true
              echo "--- 宿主侧 testmanagerd/CoreSimulator ---"
              log show --last 10m \
                --predicate 'process == "testmanagerd" OR process CONTAINS "CoreSimulator" OR process == "xcodebuild"' \
                --style compact 2>/dev/null | grep -iE 'error|fail|timeout|hang|PhotoDesk|xctest' | tail -c 8000 || true
              echo "--- 宿主进程 ---"
              ps aux | grep -E 'xcodebuild|xctest|CoreSimulator|testmanagerd' | grep -v grep | head -12 || true
            else
              echo "真实测试失败，不重试"
              exit 1
            fi
            for i in 1 2; do
              echo "runner 启动挂死，重置模拟器后重试（第 $i 次）"
              reset_sim
              if run_tests; then
                echo "TEST_OK after retry $i"
                exit 0
              fi
            done
            exit 1
          fi

      # M18 T08：runner 启动挂死诊断——抓 runner/xctest 系统日志与崩溃报告
      - name: Dump runner diagnostics on failure
        if: failure()
        run: |
          mkdir -p build/screenshots
          xcrun simctl spawn $SIM_UDID log show --last 15m \
            --predicate 'processImagePath CONTAINS "xctest" OR processImagePath CONTAINS "PhotoDeskUITests" OR senderImagePath CONTAINS "CoreSimulator"' \
            > build/screenshots/runner-diag.log 2>&1 || true
          echo "--- runner-diag tail ---"
          tail -c 6000 build/screenshots/runner-diag.log || true
          echo "--- DiagnosticReports ---"
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20 || true

      # M12/M13 取证：UI 测试失败时 App 视觉现场 + App 自写崩溃/缩放日志
      - name: Capture simulator state on failure
        if: failure()
        run: |
          mkdir -p build/screenshots
          xcrun simctl io $SIM_UDID screenshot build/screenshots/failure-sim-state.png || true
          APP_DATA=$(xcrun simctl get_app_container $SIM_UDID com.example.PhotoDesk data 2>/dev/null || true)
          if [ -n "$APP_DATA" ]; then
            cp "$APP_DATA/Library/Application Support/Logs/last-exception.log" build/screenshots/last-exception.log 2>/dev/null || true
            cp "$APP_DATA/Library/Application Support/Logs/signal-crash.log" build/screenshots/signal-crash.log 2>/dev/null || true
            cp "$APP_DATA/Library/Application Support/Logs/viewer-trace.log" build/screenshots/viewer-trace.log 2>/dev/null || true
            tail -40 "$APP_DATA/Library/Application Support/Logs/viewer-trace.log" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshot
          path: build/screenshots
          if-no-files-found: ignore

      - name: Extract UI test attachments
        if: always()
        run: |
          mkdir -p build/attachments
          # Xcode 16+ 用 export attachments；旧工具链退回 export diagnostics（含失败自动截图）
          xcrun xcresulttool export attachments --path build/TestResults.xcresult \
            --output-path build/attachments \
          || xcrun xcresulttool export diagnostics --path build/TestResults.xcresult \
            --output-path build/attachments \
          || echo "附件提取失败（非致命，见上方报错）"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-attachments
          path: build/attachments
          if-no-files-found: ignore

      - name: Package simulator app
        if: always()
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          cd "$(dirname "$APP")"
          zip -qry "$GITHUB_WORKSPACE/build/PhotoDesk-Simulator.app.zip" "$(basename "$APP")"

      # 部署目标红线校验：Deployment Target 被依赖抬高会导致老设备 dyld 崩溃
      - name: Verify deployment target
        if: always()
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          otool -l "$APP/PhotoDesk" | grep -A3 LC_BUILD_VERSION
          otool -l "$APP/PhotoDesk" | grep -A3 LC_BUILD_VERSION | grep -q "minos $MINOS_VERSION" || {
            echo "::error::LC_BUILD_VERSION minos != $MINOS_VERSION"; exit 1; }

      # 未签名 ipa（手机验证用，docs/06 §7.4）：CODE_SIGNING_ALLOWED=NO 产出未签名 .app，Payload 打包成 ipa；
      # Windows 上由 AltServer 用免费 Apple ID 现场签名安装（docs/09 D17：附 SHA256 + 自签说明 docs/12）。
      # 独立 DerivedData 洁净室构建：发布链严格锁 Xcode 16.4（AGENTS §1），与测试步的镜像最新
      # Xcode 缓存隔离，避免 Swift 模块版本混用（2026-11-17 run 44156667472 实锤）
      - name: Build unsigned ipa
        if: always()
        run: |
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk -sdk iphoneos -configuration Release \
            -derivedDataPath build/DerivedData-release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -archivePath build/PhotoDesk.xcarchive archive
          mkdir -p build/Payload
          cp -R build/PhotoDesk.xcarchive/Products/Applications/PhotoDesk.app build/Payload/
          cd build && zip -qry PhotoDesk-unsigned.ipa Payload
          shasum -a 256 PhotoDesk-unsigned.ipa > PhotoDesk-unsigned.ipa.sha256
          cat PhotoDesk-unsigned.ipa.sha256

      # IPA 产物校验（Payload 结构 / MinimumOSVersion / minos / 确认未签名）
      - name: Verify unsigned ipa
        if: always()
        run: |
          cd build
          unzip -l PhotoDesk-unsigned.ipa | grep -q "Payload/PhotoDesk.app/PhotoDesk" || {
            echo "::error::IPA 缺 Payload/PhotoDesk.app/PhotoDesk"; exit 1; }
          unzip -qo PhotoDesk-unsigned.ipa -d ipa-check Payload/PhotoDesk.app/Info.plist
          PLIST_MINOS=$(plutil -extract MinimumOSVersion raw -o - ipa-check/Payload/PhotoDesk.app/Info.plist)
          echo "MinimumOSVersion=$PLIST_MINOS"
          test "$PLIST_MINOS" = "$MINOS_VERSION" || {
            echo "::error::MinimumOSVersion != $MINOS_VERSION"; exit 1; }
          unzip -qo PhotoDesk-unsigned.ipa -d ipa-check Payload/PhotoDesk.app/PhotoDesk
          otool -l ipa-check/Payload/PhotoDesk.app/PhotoDesk | grep -A3 LC_BUILD_VERSION
          otool -l ipa-check/Payload/PhotoDesk.app/PhotoDesk | grep -A3 LC_BUILD_VERSION | grep -q "minos $MINOS_VERSION" || {
            echo "::error::ipa minos != $MINOS_VERSION"; exit 1; }
          if codesign -dv ipa-check/Payload/PhotoDesk.app 2>&1 | grep -qi "Signature"; then
            echo "::error::IPA 不应是已签名包"; exit 1
          fi
          echo "[OK] 未签名 IPA 校验通过（Payload / MinimumOSVersion=$MINOS_VERSION / minos=$MINOS_VERSION / 未签名）"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhotoDesk-Simulator-app-zip
          path: build/PhotoDesk-Simulator.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhotoDesk-unsigned-ipa
          path: |
            build/PhotoDesk-unsigned.ipa
            build/PhotoDesk-unsigned.ipa.sha256

      - name: Simulator smoke (install / launch / photos / screenshot)
        run: |
          xcrun simctl boot $SIM_UDID 2>/dev/null || true
          xcrun simctl bootstatus $SIM_UDID -b
          bash scripts/sim-photos.sh
          APP=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install $SIM_UDID "$APP"
          # 授权由性能测试的中断监视器自动点系统弹窗完成（docs/06 §6.2 模式）
          xcrun simctl launch $SIM_UDID com.example.PhotoDesk
          sleep 5
          mkdir -p build/screenshots
          xcrun simctl io $SIM_UDID screenshot build/screenshots/m1-intro.png

      - uses: actions/upload-artifact@v4
        with:
          name: m1-screenshots
          path: build/screenshots

      - name: Performance tests (5,000+ photos)
        env:
          DEVELOPER_DIR: ${{ env.TEST_DEVELOPER_DIR }}
        run: |
          rm -rf /tmp/simphotos
          bash scripts/sim-photos.sh 5000
          xcodebuild -project PhotoDesk.xcodeproj -scheme PhotoDesk \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:PhotoDeskUITests/PerformanceUITests test
          xcrun simctl launch $SIM_UDID com.example.PhotoDesk
          sleep 25
          xcrun simctl io $SIM_UDID screenshot build/screenshots/m1-grid.png

      - uses: actions/upload-artifact@v4
        with:
          name: m1-grid-screenshot
          path: build/screenshots/m1-grid.png

      - name: Collect crash reports on failure
        if: failure()
        run: |
          mkdir -p build/crashes
          cp -R ~/Library/Logs/DiagnosticReports build/crashes/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-reports
          path: build/crashes
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/Logs
          if-no-files-found: ignore




